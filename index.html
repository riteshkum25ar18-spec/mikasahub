<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MIKASAHUB</title>

<style>
body {
    margin: 0;
    background: white;
    color: black;
    font-family: Arial, sans-serif;
}

header {
    background: #222;
    color: white;
    text-align: center;
    padding: 12px;
}

h1 {
    margin: 0;
    font-size: 24px;
}

header p {
    margin: 5px 0 0;
    font-size: 13px;
}

main {
    padding: 10px;
}

.search {
    margin-bottom: 12px;
}

.search input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #555;
}

.section {
    border: 1px solid #999;
    padding: 8px;
    margin-bottom: 10px;
}

.section h2 {
    margin: 0 0 8px;
    font-size: 18px;
}

.ai-input {
    width: 100%;
    height: 70px;
    box-sizing: border-box;
    padding: 8px;
    font-size: 15px;
    border: 1px solid #555;
}

.ai-button {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    background: #eee;
    border: 1px solid #777;
    font-size: 16px;
}

.answer {
    margin-top: 8px;
    padding: 8px;
    border: 1px solid #999;
    background: #fafafa;
    min-height: 35px;
    white-space: pre-wrap;
}

.button {
    display: block;
    padding: 12px 8px;
    margin: 6px 0;
    background: #eee;
    border: 1px solid #777;
    color: black;
    text-decoration: none;
}

footer {
    text-align: center;
    border-top: 1px solid #999;
    padding: 12px;
    font-size: 12px;
}
</style>
</head>

<body>

<header>
    <h1>MIKASAHUB</h1>
    <p>Fast & Lightweight Entertainment</p>
</header>

<main>

<div class="search">
    <input type="text" id="searchBox"
    placeholder="Search MIKASAHUB">
</div>


<!-- MIKASA AI -->

<div class="section">

<h2>MIKASA AI</h2>

<textarea
class="ai-input"
id="question"
placeholder="Type your question..."></textarea>

<button class="ai-button" onclick="askAI()">
ASK
</button>

<div class="answer" id="answer">
Answer will appear here.
</div>

</div>


<div class="section">

<h2>Entertainment</h2>

<a class="button" href="music.html">1. Music</a>
<a class="button" href="videos.html">2. Videos</a>
<a class="button" href="manga.html">3. Manga</a>

</div>


<div class="section">

<h2>Downloads</h2>

<a class="button" href="downloads.html">4. Downloads</a>
<a class="button" href="books.html">5. E-Books</a>

</div>


<div class="section">

<h2>Other</h2>

<a class="button" href="tools.html">6. Tools</a>
<a class="button" href="about.html">7. About</a>

</div>

</main>


<footer>
MIKASAHUB © 2026
</footer>


<script>

/* SEARCH */

const searchBox =
document.getElementById("searchBox");

searchBox.addEventListener("input", function() {

    const text =
    searchBox.value.toLowerCase();

    const buttons =
    document.querySelectorAll(".button");

    buttons.forEach(function(button) {

        if (
        button.textContent
        .toLowerCase()
        .includes(text)
        ) {

            button.style.display = "block";

        } else {

            button.style.display = "none";

        }

    });

});


/* OFFLINE AI DEMO */

function askAI() {

    const q =
    document.getElementById("question")
    .value
    .toLowerCase()
    .trim();

    const answer =
    document.getElementById("answer");


    if (q === "") {

        answer.innerHTML =
        "Please type a question.";

        return;

    }


    /* BASIC QUESTIONS */


    if (
    q.includes("what is atom") ||
    q.includes("define atom") ||
    q.includes("atom kya hai")
    ) {

        answer.innerHTML =
        "An atom is the smallest unit of an element that retains the chemical properties of that element.";

        return;

    }


    if (
    q.includes("speed") &&
    q.includes("formula")
    ) {

        answer.innerHTML =
        "Speed = Distance ÷ Time";

        return;

    }


    if (
    q.includes("newton") &&
    q.includes("first law")
    ) {

        answer.innerHTML =
        "Newton's First Law states that an object remains at rest or in uniform motion unless acted upon by an external unbalanced force.";

        return;

    }


    if (
    q.includes("photosynthesis")
    ) {

        answer.innerHTML =
        "Photosynthesis is the process by which green plants prepare food using sunlight, carbon dioxide and water in the presence of chlorophyll.";

        return;

    }


    if (
    q.includes("cell") &&
    q.includes("basic unit")
    ) {

        answer.innerHTML =
        "The cell is the basic structural and functional unit of life.";

        return;

    }


    if (
    q.includes("democracy")
    ) {

        answer.innerHTML =
        "Democracy is a system of government in which people choose their representatives through elections.";

        return;

    }


    if (
    q.includes("hello") ||
    q.includes("hi")
    ) {

        answer.innerHTML =
        "Hello! I am Mikasa AI.";

        return;

    }


    if (
    q.includes("who are you") ||
    q.includes("your name")
    ) {

        answer.innerHTML =
        "I am Mikasa AI, the lightweight AI assistant of MikasaHub.";

        return;

    }


    /* UNKNOWN QUESTION */

    answer.innerHTML =
    "I don't know this yet. Try a Class 9 Science, Maths or Social Science question.";

}

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIKASAHUB</title>

<style>
body {
    margin: 0;
    background: white;
    color: black;
    font-family: Arial, sans-serif;
}

header {
    background: #222;
    color: white;
    text-align: center;
    padding: 12px;
}

h1 {
    margin: 0;
    font-size: 24px;
}

header p {
    margin: 5px 0 0;
    font-size: 13px;
}

main {
    padding: 10px;
}

.search {
    margin-bottom: 12px;
}

.search input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #555;
}

.section {
    border: 1px solid #999;
    padding: 8px;
    margin-bottom: 10px;
}

.section h2 {
    margin: 0 0 8px;
    font-size: 18px;
}

.button {
    display: block;
    padding: 12px 8px;
    margin: 6px 0;
    background: #eee;
    border: 1px solid #777;
    color: black;
    text-decoration: none;
}

footer {
    text-align: center;
    border-top: 1px solid #999;
    padding: 12px;
    font-size: 12px;
}
</style>
</head>

<body>

<header>
    <h1>MIKASAHUB</h1>
    <p>Fast & Lightweight Entertainment</p>
</header>

<main>

<div class="search">
    <input type="text" id="searchBox" placeholder="Search MIKASAHUB">
</div>

<div class="section">
    <h2>Entertainment</h2>

    <a class="button" href="music.html">1. Music</a>
    <a class="button" href="videos.html">2. Videos</a>
    <a class="button" href="manga.html">3. Manga</a>
</div>

<div class="section">
    <h2>Downloads</h2>

    <a class="button" href="downloads.html">4. Downloads</a>
    <a class="button" href="books.html">5. E-Books</a>
</div>

<div class="section">
    <h2>Other</h2>

    <a class="button" href="tools.html">6. Tools</a>
    <a class="button" href="about.html">7. About</a>
</div>

</main>

<footer>
    MIKASAHUB © 2026
</footer>

<script>
const searchBox = document.getElementById("searchBox");

searchBox.addEventListener("input", function() {
    const text = searchBox.value.toLowerCase();
    const buttons = document.querySelectorAll(".button");

    buttons.forEach(function(button) {
        if (button.textContent.toLowerCase().includes(text)) {
            button.style.display = "block";
        } else {
            button.style.display = "none";
        }
    });
});
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MIKASAHUB - YouTube</title>

<style>
body {
    margin: 0;
    background: white;
    color: black;
    font-family: Arial, sans-serif;
}

header {
    background: #222;
    color: white;
    text-align: center;
    padding: 12px;
}

h1 {
    margin: 0;
    font-size: 22px;
}

main {
    padding: 10px;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #555;
}

.button {
    display: block;
    padding: 12px 8px;
    margin: 8px 0;
    background: #eee;
    border: 1px solid #777;
    color: black;
    text-decoration: none;
}

.info {
    border: 1px solid #999;
    padding: 8px;
    margin-top: 12px;
    font-size: 13px;
}
</style>
</head>

<body>

<header>
    <h1>MIKASAHUB</h1>
    <p>YouTube Link Finder</p>
</header>

<main>

<input
    type="text"
    id="q"
    placeholder="Enter video name..."
>

<a class="button" id="search" href="#">
    🔎 Search YouTube
</a>

<div class="info">
    Search YouTube → open the video → copy its YouTube link.
</div>

</main>

<script>
document.getElementById("search").onclick = function() {

    var q = document.getElementById("q").value;

    if (q == "") {
        return false;
    }

    this.href =
    "https://www.youtube.com/results?search_query="
    + encodeURIComponent(q);

    return true;
};
</script>

</body>
</html>
